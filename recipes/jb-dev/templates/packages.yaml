packages:
  arch=gh200:
    all:
      providers:
        gl: [egl]
    egl:
      externals:
      - spec: egl@1.0.0
        prefix: /usr
      buildable: false
    llvm:
      require: llvm ~gold ~cuda

    # continuations branch available from here
    openmpi:
      package_attributes:
        git: https://github.com/biddisco/ompi

  arch=turing:
    all:
      providers:
        gl: [egl]
    egl:
      externals:
      - spec: egl@1.0.0
        prefix: /usr
      buildable: false
    llvm:
      require: llvm ~gold ~cuda

    # continuations branch available from here
    openmpi:
      package_attributes:
        git: https://github.com/biddisco/ompi

  arch=zen2:
    all:
      providers:
        gl: [osmesa]
    llvm:
      require: llvm ~gold ~cuda

    # continuations branch available from here
    openmpi:
      package_attributes:
        git: https://github.com/biddisco/ompi
