${ENVNAME}:

  views:
    develop:
      exclude: []
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]

  unify: true

  compiler:
    !inc ./${COMPILER}.yaml

  mpi:
    !inc ./${MPI}.yaml

  packages:
  - git
  - perl

  specs:
  # Build + repo tools
  - cmake
  - ninja
  - git-lfs
  - direnv
  - libtree

  # sys tools
  - hwloc

  # mpi tools
  - osu-micro-benchmarks

  # c++ helpers
  - fmt@10
  - stdexec@main
  - boost            ~mpi +atomic +container +context +coroutine +json +multithreaded +program_options +serialization +shared +system +test +thread

  # IO
  - hdf5             +mpi +cxx +hl
  - h5hut@master

  # maths
  - eigen
  - fftw
  - proj
  - blaspp           ~openmp
  - lapackpp

  # allocators/memory management
  - mimalloc         +skip_collect_on_exit
  - umpire           ~shared ~mpi

  # profiling/testing/logging
  - gperftools
  - googletest
  - protobuf
  - spdlog

  - !inc ${ARCH}-specs.yaml

  variants:
  - build_type=Release
  - cxxstd=17
  - ~fortran
  - ~examples
  - ~tests
  - ~testing
  - +mpi
  - +cxx
  - +python
  - !inc ${ARCH}-variants.yaml

