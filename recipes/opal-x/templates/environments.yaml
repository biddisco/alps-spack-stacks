${ENVNAME}:

  views:
    develop:
      # Exclude gcc-runtime to avoid adding a copy of libgomp.so to the view
      exclude: [gcc-runtime]
      link: all
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]

  unify: true

  compiler=gcc:
    compiler: [gcc]
  compiler=llvm:
    compiler: [llvm]
  compiler=gcc+llvm:
    compiler: [gcc, llvm]

  network:
    # ---------------
    # mpich
    # ---------------
    mpi=mpich:
      cluster=eiger:
        mpi: cray-mpich@8.1.32
        specs: ['libfabric@2.2.0']
      cluster=oryx:
        mpi: mpich +cuda
      cluster=beverin:
        mpi: cray-mpich@9 +rocm
        specs:
        - libfabric       @git.860a13caf4b7852b3334894da4be51e851913485=main fabrics=lnx,cxi,rxm,tcp,shm   
        - cassini-headers @git.4d2c6845ae99f70ebc4b96e6a82b20989cc6bfaf=main
        - cxi-driver      @git.22ce80b6e33e9eb1564b65eb2043d4c7c613d728=main
        - libcxi          @git.1eab4498d397c91de4f3652b9dfec1f9045fa4c8=main
      cluster=else:
        mpi: cray-mpich@9 +cuda
        specs:
        - libfabric       @git.860a13caf4b7852b3334894da4be51e851913485=main +gdrcopy fabrics=lnx,cxi,rxm,tcp,shm   
        - cassini-headers @git.4d2c6845ae99f70ebc4b96e6a82b20989cc6bfaf=main
        - cxi-driver      @git.22ce80b6e33e9eb1564b65eb2043d4c7c613d728=main
        - libcxi          @git.1eab4498d397c91de4f3652b9dfec1f9045fa4c8=main
             
    # ---------------
    # openmpi
    # ---------------
    mpi=ompi:
      cluster=eiger:
        mpi: openmpi@git.v5.0.x=main
        specs: ['libfabric@2.2.0']
      cluster=else:
        mpi: openmpi@git.v5.0.x=main +cuda +continuations fabrics=cma,ofi,xpmem schedulers=slurm +internal-pmix +cray-xpmem
        specs: 
        - libfabric       @git.860a13caf4b7852b3334894da4be51e851913485=main +gdrcopy fabrics=lnx,cxi,rxm,tcp,shm   
        - cassini-headers @git.4d2c6845ae99f70ebc4b96e6a82b20989cc6bfaf=main
        - cxi-driver      @git.22ce80b6e33e9eb1564b65eb2043d4c7c613d728=main
        - libcxi          @git.1eab4498d397c91de4f3652b9dfec1f9045fa4c8=main

  packages:
  - git
  - perl
  - libtool

  specs:
  - bash@5.2

  # ----------
  # Build + repo tools
  # ----------
  - cmake
  - ninja
  - direnv

  # ----------
  # sys tools
  # ----------
  - hwloc

  # ----------
  # mpi tools
  # ----------
  - osu-micro-benchmarks

  # ----------
  # runtime/framework
  # ----------
  - kokkos +openmp

  # ----------
  # C++ libraries
  # ----------
  - boost +atomic +chrono +container +context +coroutine +filesystem +iostreams +json 
    +multithreaded +program_options +regex +serialization +shared +system +test +thread 
    +timer

  # ----------
  # IO/files
  # ----------
  - hdf5 +mpi +cxx +hl +szip +shared
  - h5hut@master

  # ----------
  # maths
  # ----------
  - gsl
  - fftw
  - heffte@2.4.1 ~python +fftw
  - eigen
  - blaspp@2024.10.26
  - lapackpp@2024.10.26

  - papi
  - gperftools
  - googletest

  # ----------
  # viz support
  # ----------
  - conduit +python +mpi +hdf5
  - libcatalyst +mpi +conduit +python
  - ascent@develop +python ~adios2 ~vtkh ~raja ~umpire
    # - adios2 +hdf5 +mpi ~zfp ~mgard

  - arch=mi300:
    # GPU support
    - hip
      
  - arch=gh200:
    # GPU support
    - cuda@12.8
    # ----------
    # debugging/profiling/testing/logging
    # ----------
    - hpctoolkit@2025.0.1 ~python
    - dyninst@master
    - elfutils ~debuginfod
    - "libunwind@1.8.1:"
    - cmake@4 # cmake 3.29+ introduced a cupti bug, use 4.x

  - arch=zen2:
    # Maths
    - intel-oneapi-mkl
    - openblas

  - arch=ada:
    # GPU support
    - cuda@12
    - whip@main

    # Maths
    - intel-oneapi-mkl

  variants:
  - build_type=Release
  - cxxstd=20
  - ~fortran
  - ~examples
  - ~tests
  - ~testing
  - +mpi
  - +cxx
  - +python

  - arch=mi300:
    # GPU support
    - ~cuda
    - +rocm
    - amdgpu_target=gfx942
    - +wrapper
    - ~x11
    - ^[virtuals=gl] egl

  - arch=gh200:
    - +cuda
    - cuda_arch=90
      # - +cuda_uvm
    - +wrapper
    - ~x11
    - ^[virtuals=gl] egl

  - arch=zen2:
    - ~cuda
    - ~x11

  - arch=ada:
    - +cuda
    - cuda_arch=89
    - +wrapper
    - ~x11
    - ^[virtuals=gl] egl
