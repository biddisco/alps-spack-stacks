paraview-cuda:

  compiler=gcc:
    compiler: [gcc]
  compiler=llvm:
    compiler: [llvm]
  compiler=gcc-llvm:
    compiler: [gcc, llvm]

  network:
    # ---------------
    # mpich
    # ---------------
    mpi=mpich:
      cluster=eiger:
        mpi: cray-mpich@9
      cluster=oryx:
        mpi: mpich +cuda
      cluster=else:
        mpi: cray-mpich@9 +cuda
             

    # ---------------
    # openmpi
    # ---------------
    mpi=ompi:
      cluster=eiger:
        specs: ['openmpi@git.v5.0.x=main']
      cluster=oryx:
        specs: ['openmpi@git.v5.0.x=main']
      cluster=else:
        specs: ['openmpi@git.v5.0.x=main']

  unify: true

  views:
    default:
      link: run
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
        env_vars:
          set:
            - CUDAARCHS: "90a"
            # note: these are needed for the launch script, but it might change
            - PARAVIEW_INSTALL_DIR: $@mount@/paraview
            - PARAVIEW_PLUGINS_DIR: $@mount@/paraview-plugins
            # note: by default use paraview catalyst implementation
            - CATALYST_IMPLEMENTATION_NAME: paraview
            - CATALYST_IMPLEMENTATION_PATHS: $@mount@/paraview/lib64/catalyst
          prepend_path:
            # note: these are needed because paraview is not installed by spack
            - PATH: $@mount@/paraview/bin
            - LD_LIBRARY_PATH: $@mount@/paraview/lib64
            # note: these are needed because paraview plugins are not installed by spack
            - LD_LIBRARY_PATH: $@mount@/paraview-plugins/lib64
            - LD_LIBRARY_PATH: $@mount@/paraview-plugins/nvidia-index/lib
    develop:
      exclude: ["paraview-cuda"]
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
  specs:

  # Build + repo tools
  - git-lfs
  - cmake
  - direnv
  - ninja
  - libtree
  - llvm ~gold ~cuda

  # c++ helpers
  - fmt@11
  - boost +atomic +chrono +container +context +date_time +filesystem +graph +json +mpi +multithreaded +program_options +regex +serialization +shared +system +thread ~test

  # IO and parallelism
  - hdf5 +mpi +cxx +hl +threadsafe +shared ~java
  - netcdf-c +mpi
  - lz4
  - adios2 +python +hdf5 +libcatalyst ~zfp
  - adios-catalyst
  - h5hut@master

  # multithreading
  - tbb

  # in-situ support
  - libcatalyst +mpi +python
  - fides
#  - ascent +cuda +vtkh +python +occa ~mfem 
#  - conduit

  # vtk external deps
  - abseil-cpp
  - cgns #@4.4.0
  - cli11
  - double-conversion #@3.3.0
  - eigen
  - expat
  - fast-float@7
  - fmt@11
  - freetype
  - git
  - gl2ps
  - glew
  - jpeg
  - jsoncpp
  - libharu
  - libogg
  - libpng
  - libtheora #@git.7180717276af1ebc7da15c83162d6c5d6203aabf=master
  - libtiff
  - libxml2
  - nlohmann-json
  - parallel-netcdf
  - pegtl@2
  - proj
  - protobuf #@:3.21 # problem about crc arm vs crc aarch64 -- give a try to 33.0, it failed with 32.1
  - pugixml
  - seacas@2025-02-27 ~legacy
  - sqlite
  - utf8cpp
  - verdict +shared
  - xz
  - zlib-ng
  - viskores@1.1 +64bitids +tbb +vtktypes

  # climate/weather
  - cdi

  # python
  - python
  - py-numpy
  - py-pandas
  - py-matplotlib
  - py-mpi4py
  - py-cftime
  - py-h5py

  # raytracing in VTK/ParaView
  - ospray ~mpi +denoiser +volumes ~apps ~glm
  - ispc
  - openvkl
  - embree
  - rkcommon
  - openimagedenoise

  - arch=gh200:
    # CUDA/HIP support
    - cuda

    # Maths
    - nvpl-blas      threads=none
    - nvpl-lapack    threads=none
    - openblas

  - arch=zen2:
    # offscreen rendering
    - mesa         +osmesa
    - osmesa
    - glew

    # Maths
    - intel-oneapi-mkl

  - arch=ada:
    # CUDA
    - cuda
    - whip@main

    # Maths
    - openblas
    - intel-oneapi-mkl

  variants:
  - build_type=Release
  - cxxstd=17
  - ~fortran
  - ~examples
  - ~tests
  - ~testing
  - +mpi
  - +cxx
  - +python


  - arch=gh200:
    - +cuda
    - cuda_arch=90
    - ~x11
    - ^[virtuals=gl] egl

  - arch=zen2:
    - ~cuda
    - ~x11
    - ^[virtuals=gl] osmesa ^mesa +osmesa

  - arch=ada:
    - +cuda
    - cuda_arch=89
    - ~x11
    - ^[virtuals=gl] egl
