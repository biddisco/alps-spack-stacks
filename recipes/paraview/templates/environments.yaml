${ENVNAME}:

  views:
    develop:
      # Exclude gcc-runtime to avoid adding a copy of libgomp.so to the view
      exclude: [gcc-runtime]
      link: all
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]

    paraview:
      link: run
      exclude: [gcc-runtime]
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]

  unify: true

  compiler=gcc:
    compiler: [gcc]
  compiler=llvm:
    compiler: [llvm]
  compiler=gcc+llvm:
    compiler: [gcc, llvm]

  mpi:
    mpi=mpich:
      cluster=eiger:
        spec: cray-mpich@9
        depends: [libfabric@main]
      cluster=oryx:
        spec: laptop-mpich
        gpu: cuda
      cluster=else:
        spec: cray-mpich@9
        gpu: cuda
        xspec: +cxi
        depends:
        - cassini-headers @git.59b6de6a91d9637809677c50cc48b607a91a9acb=main
        - cxi-driver      @git.08deb056fac4ca8b0d3d39b5f7cc0dad019ee266=main
        - libcxi          @git.be1f7149482581ad589a124e5f6764b9d20d2d45=main
        - libfabric       @git.v2.2.0=main +gdrcopy fabrics=lnx,cxi,rxm,tcp,shm
        
    mpi=ompi:
      spec: openmpi@git.mpi-continue-5.0.6=main
      xspec: +continuations +internal-pmix fabrics=cma,ofi,xpmem schedulers=slurm +cray-xpmem
      gpu: null
      depends: ["libfabric@main"]

  packages:
  - git
  - perl

  specs:
  - libtool@2.4.6
  - bash@5.2

  # Build + repo tools
  - git-lfs
  - cmake
  - direnv
  - ninja
  - libtree
  - llvm ~gold ~cuda

  # sys tools
  - hwloc
  - numactl

  # profiling/testing/logging
  - gperftools
  - googletest
  - protobuf
  - spdlog

  # maths
  - blaspp
  - eigen
  - fftw
  - lapackpp
  - openblas
  - proj

  # c++ libraries
  - fmt@11
  - stdexec@git.nvhpc-25.03.rc1=main
  - boost +atomic +chrono +container +context +coroutine +date_time +filesystem +graph +json +mpi +multithreaded +program_options +regex +serialization +shared +system +test +thread

  # IO and parallelism
  - hdf5 +mpi +cxx +hl +threadsafe +shared ~java
  - netcdf-c +mpi
  - adios2 +python +hdf5 ~zfp
  - h5hut@master
  - lz4

  # allocators/memory management
  - jemalloc
  - mimalloc

  # profiling/testing
  - gperftools
  - googletest

  # multithreading
  - tbb

  # in-situ support
  - libcatalyst +mpi +python

  # vtk external deps
#  - viskores +cuda_native +mpi
  - cgns@4.4.0
  - double-conversion@3.3.0
  - gl2ps
  - glew
  - jpeg
  - jsoncpp
  - libharu
  - libtiff
  - nlohmann-json
  - libtheora@git.7180717276af1ebc7da15c83162d6c5d6203aabf=master
  - pugixml
  - pegtl
  - protobuf@:3.21
  - seacas ~fortran ~applications ~legacy ~tests ~x11
  - utf8cpp

  # climate/weather
  - cdi

  # raytracing in VTK/ParaView
  - ospray@3.2 ~mpi +denoiser +volumes ~apps ~glm
  - ispc@1.23
  - openvkl
  - embree
  - rkcommon
  - openimagedenoise

  # python
  - python@3.11
  - py-numpy
  - py-pandas
  - py-matplotlib
  - py-mpi4py
  - py-cftime
  - py-h5py

  - arch=gh200:
    # CUDA/HIP support
    - cuda
    - whip@main

    # Maths
    - nvpl-blas      threads=none
    - nvpl-lapack    threads=none
    - openblas

  - arch=zen2:
    # offscreen rendering
    - mesa         +osmesa
    - osmesa
    - glew

    # Maths
    - intel-oneapi-mkl

  - arch=ada:
    # CUDA
    - cuda
    - whip@main

    # Maths
    - openblas
    - intel-oneapi-mkl

  variants:
  - build_type=Release
  - cxxstd=17
  - ~fortran
  - ~examples
  - ~tests
  - ~testing
  - +mpi
  - +cxx
  - +python

  - arch=gh200:
    - +cuda
    - cuda_arch=90
    - ~x11
    - ^[virtuals=gl] egl

  - arch=zen2:
    - ~cuda
    - ~x11
    - ^[virtuals=gl] osmesa ^mesa +osmesa

  - arch=ada:
    - +cuda
    - cuda_arch=89
    - ~x11
    - ^[virtuals=gl] egl
