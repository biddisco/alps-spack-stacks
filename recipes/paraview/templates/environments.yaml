${ENVNAME}:

  views:
    develop:
      # Exclude gcc-runtime to avoid adding a copy of libgomp.so to the view
      exclude: [gcc-runtime]
      link: all
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]

    paraview:
      link: run
      exclude: [gcc-runtime]
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]

  unify: true

  compiler=gcc:
    compiler: [gcc]
  compiler=llvm:
    compiler: [llvm]
  compiler=gcc-llvm:
    compiler: [gcc, llvm]

  network:
    # ---------------
    # mpich
    # ---------------
    mpi=mpich:
      cluster=eiger:
        mpi: cray-mpich@9
        specs: ['libfabric@2.3.1']
      cluster=oryx:
        mpi: mpich +cuda
      cluster=else:
        mpi: cray-mpich@9 +cuda
        specs:
        - libfabric@2.3.1   
             
        # specs: ['libfabric@git.v2.2.0=main fabrics=lnx,cxi,rxm,tcp,shm']
        # xspec: +cxi
        # depends:
        # - cassini-headers @git.4d2c6845ae99f70ebc4b96e6a82b20989cc6bfaf=main
        # - cxi-driver      @git.6d61eeb23a7cf0c56b8043dfe89f341119cdb86b=main
        # - libcxi          @git.4fac509ba8f1494d4a52fbfd9343bdd4b54cfadc=main
        # - libfabric       @git.v2.2.0=main +gdrcopy fabrics=lnx,cxi,rxm,tcp,shm

    # ---------------
    # openmpi
    # ---------------
    mpi=ompi:
      cluster=eiger:
        specs: ['openmpi@git.v5.0.x=main']
      cluster=oryx:
        specs: ['openmpi@git.v5.0.x=main']
      cluster=else:
        specs: ['openmpi@git.v5.0.x=main']

  packages:
  - git
  - perl

  specs:
  - libtool@2.4.6
  - bash@5.2

  # Build + repo tools
  - git-lfs
  - cmake
  - direnv
  - ninja
  - libtree
  - llvm ~gold ~cuda

  # sys tools
  - hwloc
  - numactl

  # profiling/testing/logging
  - gperftools
  - googletest
  - protobuf
  - spdlog

  # maths
  - blaspp
  - eigen
  - fftw
  - lapackpp
  - openblas
  - proj

  # c++ libraries
  - fmt@11
  - stdexec@git.nvhpc-25.03.rc1=main
  - boost +atomic +chrono +container +context +coroutine +date_time +filesystem +graph +json +mpi +multithreaded +program_options +regex +serialization +shared +system +test +thread

  # IO and parallelism
  - hdf5 +mpi +cxx +hl +threadsafe +shared ~java
  - netcdf-c +mpi
  - adios2 +python +hdf5 ~zfp
  - h5hut@master
  - lz4

  # allocators/memory management
  - jemalloc
  - mimalloc

  # profiling/testing
  - gperftools
  - googletest

  # multithreading
  - tbb

  # in-situ support
  - libcatalyst +mpi +python
#  - ascent +cuda +vtkh +python +occa ~mfem 
  - conduit

  # vtk external deps
#  - viskores +cuda_native +mpi
  - cgns@4.4.0
  - double-conversion@3.3.0
  - gl2ps
  - glew
  - jpeg
  - jsoncpp
  - libharu
  - libtiff
  - nlohmann-json
  - libtheora@git.7180717276af1ebc7da15c83162d6c5d6203aabf=master
  - pugixml
  - pegtl
  - protobuf@:3.21
  - seacas ~fortran ~applications ~legacy ~tests ~x11
  - utf8cpp
  - silo
  
  # climate/weather
  - cdi

  # raytracing in VTK/ParaView
  - ospray@3.2 ~mpi +denoiser +volumes ~apps ~glm
  - ispc@1.23
  - openvkl
  - embree
  - rkcommon
  - openimagedenoise

  # python
  - python@3.11
  - py-numpy
  - py-pandas
  - py-matplotlib
  - py-mpi4py
  - py-cftime
  - py-h5py

  - arch=gh200:
    # CUDA/HIP support
    - cuda
    - whip@main

    # Maths
    - nvpl-blas      threads=none
    - nvpl-lapack    threads=none
    - openblas

  - arch=zen2:
    # offscreen rendering
    - mesa         +osmesa
    - osmesa
    - glew

    # Maths
    - intel-oneapi-mkl

  - arch=ada:
    # CUDA
    - cuda
    - whip@main

    # Maths
    - openblas
    - intel-oneapi-mkl

  variants:
  - build_type=Release
  - cxxstd=17
  - ~fortran
  - ~examples
  - ~tests
  - ~testing
  - +mpi
  - +cxx
  - +python

  - arch=gh200:
    - +cuda
    - cuda_arch=90
    - ~x11
    - ^[virtuals=gl] egl

  - arch=zen2:
    - ~cuda
    - ~x11
    - ^[virtuals=gl] osmesa ^mesa +osmesa

  - arch=ada:
    - +cuda
    - cuda_arch=89
    - ~x11
    - ^[virtuals=gl] egl
