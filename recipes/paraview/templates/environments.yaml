${ENVNAME}:

  views:
    develop:
      exclude: []
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]

    paraview:
      link: run
      exclude: []
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]

  unify: true

  compiler:
    compiler=gcc:
      - toolchain: gcc
        spec: gcc@12
    compiler=llvm:
      - toolchain: llvm
        spec: nvhpc
    compiler=gcc+llvm:
      - toolchain: gcc
        spec: gcc@12
      - toolchain: llvm
        spec: nvhpc

  mpi:
    mpi=mpich:
      cluster=eiger:
        spec: cray-mpich@8.1.30
        depends: [libfabric@main]
      cluster=oryx:
        spec: laptop-mpich
        gpu: cuda
      cluster=else:
        spec: cray-mpich@8.1.30
        gpu: cuda
        depends: [libfabric@main]
    mpi=ompi:
      spec: openmpi@git.mpi-continue-5.0.6=main
      xspec: +continuations +internal-pmix fabrics=cma,ofi,xpmem schedulers=slurm +cray-xpmem
      gpu: null
      depends: ["libfabric@main"]

  packages:
  - git
  - perl

  specs:
  # Build + repo tools
  - git-lfs
  - cmake
  - direnv
  - ninja
  - libtree
  - llvm ~gold ~cuda

  # sys tools
  - hwloc
  - numactl

  # profiling/testing/logging
  - gperftools
  - googletest
  - protobuf
  - spdlog

  # maths
  - blaspp
  - eigen
  - fftw
  - lapackpp
  - openblas
  - proj

  # c++ libraries
  - fmt@10
  - stdexec@main
  - boost +atomic +chrono +container +context +coroutine +date_time +filesystem +graph +json +mpi +multithreaded +program_options +regex +serialization +shared +system +test +thread

  # IO and parallelism
  - hdf5 +mpi +cxx +hl +threadsafe +shared ~java
  - netcdf-c +mpi
  - adios2 +python +hdf5 ~zfp
  - h5hut@master
  - lz4

  # allocators/memory management
  - jemalloc
  - mimalloc

  # profiling/testing
  - gperftools
  - googletest

  # multithreading
  - tbb

  # in-situ support
  - libcatalyst +mpi +python

  # vtk external deps
  - cgns@4.4.0
  - double-conversion@3.3.0
  - gl2ps
  - glew
  - jpeg
  - jsoncpp
  - libharu
  - libtiff
  - nlohmann-json
  - libtheora@master
  - pugixml
  - pegtl
  - protobuf@:3.21
  - seacas ~fortran ~applications ~legacy ~tests ~x11
  - utf8cpp

  # climate/weather
  - cdi

  # raytracing in VTK/ParaView
  - ospray@3.2 ~mpi +denoiser +volumes ~apps ~glm
  - ispc@1.23
  - openvkl
  - embree
  - rkcommon
  - openimagedenoise

  # python
  - python@3.11
  - py-numpy
  - py-pandas
  - py-matplotlib
  - py-mpi4py
  - py-cftime
  - py-h5py

  - arch=gh200:
    # CUDA/HIP support
    - cuda
    - whip@main

    # Maths
    - nvpl-blas      threads=none
    - nvpl-lapack    threads=none
    - openblas

  - arch=zen2:
    # offscreen rendering
    - mesa         +osmesa
    - osmesa
    - glew

    # Maths
    - intel-oneapi-mkl

  - arch=turing:
    # CUDA
    - cuda
    - whip@main

    # Maths
    - openblas
    - intel-oneapi-mkl

  variants:
  - build_type=Release
  - cxxstd=17
  - ~fortran
  - ~examples
  - ~tests
  - ~testing
  - +mpi
  - +cxx
  - +python

  - arch=gh200:
    - +cuda
    - cuda_arch=90
    - ~x11
    - ^[virtuals=gl] egl

  - arch=zen2:
    - ~cuda
    - ~x11
    - ^[virtuals=gl] osmesa ^mesa +osmesa

  - arch=turing:
    - +cuda
    - cuda_arch=89
    - ~x11
    - ^[virtuals=gl] egl
